name: Market Forensics release tests

on:
  push:
    branches: [main, dev, 'release/**']
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install lightweight runtime and tests
        run: pip install -r requirements-dev.txt
      - name: Python syntax check
        run: python -m compileall -q app.py manage.py mfapp tests
      - name: JavaScript syntax check
        run: |
          node --check mfapp/static/js/app.js
          node --check mfapp/static/js/theme.js
          node --check mfapp/static/js/flows.js
          node --check mfapp/static/js/validate_chart.js
      - name: Release test suite
        env:
          MF_SECRET_KEY: test-secret-key
          MF_ENCRYPTION_KEY: ${{ secrets.MF_TEST_ENCRYPTION_KEY }}
        run: |
          if [ -z "${MF_ENCRYPTION_KEY:-}" ]; then export MF_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"; fi
          pytest -q
