name: Market Forensics release tests

on:
  push:
    branches: [main, dev, 'release/**', 'fix/**']
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install lightweight runtime and tests
        run: pip install -r requirements-dev.txt
      - name: Python syntax check
        run: python -m compileall -q app.py manage.py mfapp tests
      - name: Workflow YAML validation
        run: |
          python - <<'PY'
          import yaml
          for path in (".github/workflows/tests.yml", ".github/workflows/deploy-namecheap.yml"):
              with open(path, "r", encoding="utf-8") as handle:
                  data = yaml.safe_load(handle)
              assert isinstance(data, dict) and ("jobs" in data), path
              print(path, "ok")
          PY
      - name: JavaScript syntax check
        run: |
          node --check mfapp/static/js/app.js
          node --check mfapp/static/js/flows.js
          node --check mfapp/static/js/validate_chart.js
      - name: Release test suite
        env:
          MF_SECRET_KEY: test-secret-key
          MF_ENCRYPTION_KEY: ${{ secrets.MF_TEST_ENCRYPTION_KEY }}
        run: |
          if [ -z "${MF_ENCRYPTION_KEY:-}" ]; then export MF_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"; fi
          pytest -q

      - name: TEMP 0.2.14 visual QA render
        if: github.ref == 'refs/heads/release/0.2.14-research-reports-v2'
        run: |
          set -euo pipefail
          rm -rf /tmp/mf-report-qa
          mkdir -p /tmp/mf-report-qa
          python - <<'PY'
          import runpy
          from pathlib import Path
          from mfapp.reporting import render_pdf, render_docx

          ns = runpy.run_path("tests/test_0214_reports_v2.py")
          sample = ns["sample_report"]
          out = Path("/tmp/mf-report-qa")
          full = sample()
          executive = sample(); executive["mode"] = "executive"
          partial = sample(complete=False); partial["mode"] = "executive"
          (out / "executive_complete.pdf").write_bytes(render_pdf(executive).getvalue())
          (out / "full_complete.pdf").write_bytes(render_pdf(full).getvalue())
          (out / "full_complete.docx").write_bytes(render_docx(full).getvalue())
          (out / "executive_data_review.pdf").write_bytes(render_pdf(partial).getvalue())
          print("visual qa source artifacts generated")
          PY
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq poppler-utils libreoffice-writer >/dev/null
          command -v pdftoppm >/dev/null
          pdftoppm -jpeg -jpegopt quality=75 -r 100 /tmp/mf-report-qa/executive_complete.pdf /tmp/mf-report-qa/executive
          pdftoppm -jpeg -jpegopt quality=72 -r 85 /tmp/mf-report-qa/full_complete.pdf /tmp/mf-report-qa/full
          pdftoppm -jpeg -jpegopt quality=75 -r 100 /tmp/mf-report-qa/executive_data_review.pdf /tmp/mf-report-qa/data_review
          if command -v libreoffice >/dev/null; then
            mkdir -p /tmp/mf-report-qa/word_render
            libreoffice --headless --convert-to pdf --outdir /tmp/mf-report-qa/word_render /tmp/mf-report-qa/full_complete.docx
            pdftoppm -jpeg -jpegopt quality=72 -r 85 /tmp/mf-report-qa/word_render/full_complete.pdf /tmp/mf-report-qa/word
          else
            echo "LibreOffice not present; DOCX is structurally validated by python-docx tests." > /tmp/mf-report-qa/WORD_RENDER_NOTE.txt
          fi
          ls -lh /tmp/mf-report-qa

      - name: TEMP upload 0.2.14 visual QA
        if: github.ref == 'refs/heads/release/0.2.14-research-reports-v2'
        uses: actions/upload-artifact@v4
        with:
          name: report-visual-qa-${{ github.sha }}
          path: /tmp/mf-report-qa
          retention-days: 1

      - name: Production-minimal startup and rich report smoke
        run: |
          set -euo pipefail
          python -m venv /tmp/mf-prod-min
          /tmp/mf-prod-min/bin/pip install -q -r requirements.txt
          MF_SECRET_KEY=test-secret-key \
          MF_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" \
          /tmp/mf-prod-min/bin/python - <<'PY'
          import os, tempfile
          from mfapp import create_app
          from mfapp.reporting import render_pdf, render_docx, report_backend_status

          db = tempfile.NamedTemporaryFile(suffix=".db", delete=False).name
          app = create_app({
              "TESTING": True,
              "AUTO_MIGRATE": True,
              "SQLALCHEMY_DATABASE_URI": "sqlite:///" + db,
              "SECRET_KEY": "prod-min-smoke",
          })
          response = app.test_client().get("/health")
          assert response.status_code == 200, response.data
          release_version = open("VERSION", encoding="utf-8").read().strip()
          assert response.get_json()["version"] == release_version
          assert report_backend_status()["backend"] == "rich"
          data = {
              "branding": {"title":"Market Forensics","footer":"Lose Money Rules"},
              "ticker":"TEST","company":"Production Minimal Smoke","action":"DATA REVIEW",
              "stance":"UNVERIFIED","confidence":"UNVALIDATED","market_price":10,"bear":8,"base":12,"bull":15,
              "base_gap_pct":20,"validation_state":"NOT RUN","decision_lenses":[],"thesis":"Smoke",
              "counter_evidence":"","variant_market":"","variant_us":"","supporting":[],"opposing":[],
              "implied_expectations":{},"mode":"executive","sources":[],
          }
          assert render_pdf(data).getvalue().startswith(b"%PDF-")
          assert render_docx(data).getvalue().startswith(b"PK")
          print("production-minimal smoke ok")
          PY

      - name: Self-contained reporting vendor smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/mf-report-vendor
          python -m pip install -q --no-cache-dir --no-compile --target /tmp/mf-report-vendor -r requirements-reporting.txt
          test -d /tmp/mf-report-vendor/docx
          test -d /tmp/mf-report-vendor/reportlab
          PYTHONPATH=/tmp/mf-report-vendor python -S - <<'PY'
          import docx
          import reportlab
          from docx import Document
          from reportlab.pdfgen import canvas
          assert Document is not None and canvas is not None
          print("self-contained report vendor ok")
          PY
