name: Market Forensics tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Syntax check
        run: python -m compileall -q app.py manage.py mfapp tests
      - name: Tests
        run: |
          export MF_SECRET_KEY="test-secret-key"
          export MF_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          pytest -q
