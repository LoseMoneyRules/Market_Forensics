name: Market Forensics tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Syntax check
        run: python -m compileall -q app.py manage.py mfapp tests
      - name: Tests
        env:
          MF_SECRET_KEY: test-secret-key
          MF_ENCRYPTION_KEY: Nc-3z8Rff1DFXHGAcCxIB8lWMecKVI9-JnQez8re9AA=
        run: pytest -q
