name: Deploy Market Forensics to Namecheap

on:
  workflow_dispatch:

concurrency:
  group: market-forensics-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify required deployment secrets
        env:
          NC_HOST: ${{ secrets.NAMECHEAP_HOST }}
          NC_USER: ${{ secrets.NAMECHEAP_USER }}
          NC_SSH_KEY: ${{ secrets.NAMECHEAP_SSH_KEY }}
          NC_KNOWN_HOSTS: ${{ secrets.NAMECHEAP_KNOWN_HOSTS }}
          NC_VENV_BIN: ${{ secrets.NAMECHEAP_VENV_BIN }}
        run: |
          set -euo pipefail
          for name in NC_HOST NC_USER NC_SSH_KEY NC_KNOWN_HOSTS NC_VENV_BIN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret: $name"
              exit 1
            fi
          done

      - name: Prepare SSH
        env:
          NC_SSH_KEY: ${{ secrets.NAMECHEAP_SSH_KEY }}
          NC_KNOWN_HOSTS: ${{ secrets.NAMECHEAP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$NC_SSH_KEY" > ~/.ssh/id_namecheap
          chmod 600 ~/.ssh/id_namecheap
          printf '%s\n' "$NC_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Build release archive
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='instance' \
            --exclude='tmp' \
            --exclude='*.db' \
            --exclude='*.sqlite' \
            --exclude='*.sqlite3' \
            -czf /tmp/market-forensics-release.tgz .

      - name: Upload release
        env:
          NC_HOST: ${{ secrets.NAMECHEAP_HOST }}
          NC_USER: ${{ secrets.NAMECHEAP_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_namecheap -P 21098 \
            /tmp/market-forensics-release.tgz \
            "$NC_USER@$NC_HOST:~/market-forensics-release.tgz"

      - name: Install release and restart Passenger
        env:
          NC_HOST: ${{ secrets.NAMECHEAP_HOST }}
          NC_USER: ${{ secrets.NAMECHEAP_USER }}
          NC_VENV_BIN: ${{ secrets.NAMECHEAP_VENV_BIN }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_namecheap -p 21098 "$NC_USER@$NC_HOST" \
            "NC_VENV_BIN='$NC_VENV_BIN' bash -s" <<'REMOTE'
          set -euo pipefail
          APP="$HOME/market_forensics"
          RELEASE="$HOME/market-forensics-release.tgz"
          STAGE="$HOME/.mf-deploy-stage"

          test -d "$APP"
          test -x "$NC_VENV_BIN/python"
          test -x "$NC_VENV_BIN/pip"

          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          tar -xzf "$RELEASE" -C "$STAGE"

          # Preserve server-only state and cPanel/Passenger files.
          rm -rf "$APP/mfapp" "$APP/docs" "$APP/tests"
          rm -f "$APP/app.py" "$APP/manage.py" "$APP/requirements.txt" \
                "$APP/requirements-dev.txt" "$APP/README.md" "$APP/VERSION"

          cp -a "$STAGE"/. "$APP"/

          "$NC_VENV_BIN/pip" install -r "$APP/requirements.txt"
          "$NC_VENV_BIN/python" -m compileall -q "$APP/app.py" "$APP/manage.py" "$APP/mfapp"

          mkdir -p "$APP/tmp"
          touch "$APP/tmp/restart.txt"

          rm -rf "$STAGE" "$RELEASE"
          REMOTE

      - name: Production health check
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            body="$(curl -fsS --max-time 10 https://mf.losemoneyrules.com/health || true)"
            if printf '%s' "$body" | grep -q '"status":"ok"'; then
              echo "$body"
              exit 0
            fi
            sleep 5
          done
          echo "Production health check failed."
          exit 1
