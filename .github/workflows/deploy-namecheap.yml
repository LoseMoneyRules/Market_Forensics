name: Deploy Market Forensics to Namecheap

on:
  workflow_dispatch:

concurrency:
  group: market-forensics-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Verify deployment secrets
        env:
          FTP_HOST: ${{ secrets.NAMECHEAP_FTP_HOST }}
          FTP_USER: ${{ secrets.NAMECHEAP_FTP_USER }}
          FTP_PASS: ${{ secrets.NAMECHEAP_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          for name in FTP_HOST FTP_USER FTP_PASS; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret: $name"
              exit 1
            fi
          done

      - name: Install FTPES client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Deploy application files over FTPES
        env:
          FTP_HOST: ${{ secrets.NAMECHEAP_FTP_HOST }}
          FTP_USER: ${{ secrets.NAMECHEAP_FTP_USER }}
          FTP_PASS: ${{ secrets.NAMECHEAP_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          printf 'restart %s\n' "${GITHUB_SHA}" > /tmp/restart.txt

          lftp <<LFTP
          set cmd:fail-exit yes
          set ssl:verify-certificate yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set net:max-retries 2
          set net:timeout 20
          open -u "$FTP_USER","$FTP_PASS" "ftp://$FTP_HOST"

          mirror --reverse --delete --verbose \
            --exclude-glob __pycache__/ \
            --exclude-glob '*.pyc' \
            ./mfapp ./mfapp

          mirror --reverse --delete --verbose \
            --exclude-glob __pycache__/ \
            --exclude-glob '*.pyc' \
            ./mfengine ./mfengine

          mirror --reverse --delete --verbose ./docs ./docs

          put -O . app.py
          put -O . manage.py
          put -O . requirements.txt
          put -O . requirements-dev.txt
          put -O . README.md
          put -O . VERSION

          put /tmp/restart.txt -o tmp/restart.txt
          bye
          LFTP

      - name: Production health check
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            body="$(curl -fsS --max-time 10 https://mf.losemoneyrules.com/health || true)"
            if printf '%s' "$body" | grep -q '"status":"ok"'; then
              echo "$body"
              exit 0
            fi
            sleep 5
          done
          echo "Production health check failed."
          exit 1
