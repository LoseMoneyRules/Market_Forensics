{% extends "base.html" %}{% block body_class %}auth-page{% endblock %}{% block content %}<section class="auth-card"><div class="eyebrow">SECURITY SETUP</div><h1>Protect your account</h1><p class="lead">Scan this QR code with your authenticator app, then enter the six-digit code.</p><div class="qr"><img src="data:image/png;base64,{{ qr }}" alt="Authenticator QR code"></div><details><summary>Can't scan it?</summary><code class="secret-code">{{ secret }}</code></details><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Authenticator code<input class="code-input" inputmode="numeric" autocomplete="one-time-code" name="code" required></label><button class="primary" type="submit">Activate account</button></form></section>{% endblock %}
