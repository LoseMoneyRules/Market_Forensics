{% extends "base.html" %}{% block body_class %}auth-page{% endblock %}{% block content %}<section class="auth-card"><div class="eyebrow">{{ invite.role }} INVITATION</div><h1>Join Market Forensics</h1><p class="lead">{{ invite.email }}</p><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Your name<input name="name" autocomplete="name" required></label><label>Create password<input type="password" name="password" minlength="12" autocomplete="new-password" required></label><button class="primary" type="submit">Continue to 2FA</button></form><p class="micro">Two-factor authentication is mandatory for every account.</p></section>{% endblock %}
